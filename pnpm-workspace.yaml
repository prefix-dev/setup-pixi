# Only install package versions that have been published for at least 7 days (in minutes).
# Mirrors the dependabot cooldown and protects against freshly compromised releases.
minimumReleaseAge: 10080

allowBuilds:
  esbuild: true

overrides:
  undici: ^6.29.0
  rollup: ^4.59.0
  fast-xml-parser: ^5.10.1
  minimatch@3>brace-expansion: ^1.1.21
  minimatch@10>brace-expansion: ^5.0.9
