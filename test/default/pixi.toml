[workspace]
name = "test-default"
channels = ["conda-forge"]
platforms = [
  "linux-64",
  "linux-aarch64",
  { platform = "linux-riscv64", glibc = "2.39" },
  "osx-64",
  "osx-arm64",
  "win-64",
  "win-arm64",
]

[tasks]
test = "python -c 'print(\"Hello world!\")'"

[dependencies]
nushell = "*"
# https://github.com/conda-forge/python-feedstock/pull/896
[target.linux-64.dependencies]
python = "3.14.*"
[target.linux-aarch64.dependencies]
python = "3.14.*"
[target.osx.dependencies]
python = "3.14.*"
[target.win.dependencies]
python = "3.14.*"
